name: KiCad Export & Release

on:
  push:
    branches:
      - main

jobs:
  export-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout PARTS submodule
        run: git submodule update --init --depth=1 PARTS

      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad kicad-libraries kicad-packages3d

      - name: Extract PROJECT_REVISION from kicad_pro
        id: get_version
        run: |
          VERSION=$(python3 -c "
          import json
          with open('DRP.004.kicad_pro') as f:
              data = json.load(f)
          print(data.get('text_variables', {}).get('PROJECT_REVISION', ''))
          ")

          if [ -z "$VERSION" ]; then
            echo "ERROR: PROJECT_REVISION not found in text_variables"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved PROJECT_REVISION: $VERSION"

      - name: Run KiCad jobset
        run: |
          mkdir -p docs .tmp
          xvfb-run --auto-servernum kicad-cli jobset run -f docs_update.kicad_jobset --output assembly   ./DRP.004.kicad_pro || true
          xvfb-run --auto-servernum kicad-cli jobset run -f docs_update.kicad_jobset --output production  ./DRP.004.kicad_pro || true
          xvfb-run --auto-servernum kicad-cli jobset run -f docs_update.kicad_jobset --output mechanical  ./DRP.004.kicad_pro || true
          xvfb-run --auto-servernum kicad-cli jobset run -f docs_update.kicad_jobset --output schematics  ./DRP.004.kicad_pro || true
        env:
          TMPDIR: /tmp

      - name: List generated outputs
        run: find docs/ -type f | sort

      - name: Create release archive
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          ZIP="DOCS_DRP.004_${TIMESTAMP}.zip"
          zip -r "$ZIP" docs/
          echo "ZIP=$ZIP"         >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Dump debug info on failure
        if: failure()
        run: |
          kicad-cli version
          cat DRP.004.kicad_pro
          ls -la
          echo "=== dmesg ===" && sudo dmesg | tail -30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "DRP.004 v${{ env.VERSION }}"
          body: |
            Automated KiCad export — commit ${{ github.sha }}

            **Version:** `${{ env.VERSION }}`
            **Branch:** `${{ github.ref_name }}`
          files: ${{ env.ZIP }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}