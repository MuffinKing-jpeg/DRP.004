name: KiCad Export & Release

on:
  push:
    branches:
      - main

jobs:
  export-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive   # pulls PARTS @ KiCAD-Parts pinned commit

      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad

      - name: Extract PROJECT_REVISION from kicad_pro
        id: get_version
        run: |
          VERSION=$(python3 -c "
          import json
          with open('DRP.004.kicad_pro') as f:
              data = json.load(f)
          print(data['text_variables']['PROJECT_REVISION'])
          ")

          if [ -z "$VERSION" ]; then
            echo "ERROR: PROJECT_VERSION not found in text_variables"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved PROJECT_VERSION: $VERSION"

      - name: Start virtual display
        run: |
          sudo apt-get install --yes xvfb
          Xvfb :99 -screen 0 1280x720x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Run KiCad jobset (skip 3D renders)
        run: |
          mkdir docs docs/mech docs/production docs/sch
          xvfb-run --auto-servernum kicad-cli jobset run -f docs_update.kicad_jobset --output assembly ./DRP.004.kicad_pro
          xvfb-run --auto-servernum kicad-cli jobset run -f docs_update.kicad_jobset --output production ./DRP.004.kicad_pro
          xvfb-run --auto-servernum kicad-cli jobset run -f docs_update.kicad_jobset --output mechanical ./DRP.004.kicad_pro
          xvfb-run --auto-servernum kicad-cli jobset run -f docs_update.kicad_jobset --output schematics ./DRP.004.kicad_pro

      - name: List generated outputs
        run: find docs/ -type f | sort

      - name: Create release archive
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          ZIP="DOCS_DRP.004_${TIMESTAMP}.zip"
          zip -r "$ZIP" docs/
          echo "ZIP=$ZIP"         >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      
      - name: Dump debug info on failure
        if: failure()
        run: |
          echo "=== ENV ===" && env | sort
          echo "=== PWD ===" && ls -la
          echo "=== kicad_pro ===" && cat DRP.004.kicad_pro
          echo "=== kicad-cli version ===" && kicad-cli --version
          echo "=== dmesg (segfault) ===" && sudo dmesg | tail -30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "DRP.004 v${{ env.VERSION }}"
          body: |
            Automated KiCad export — commit ${{ github.sha }}

            **Version:** `${{ env.VERSION }}`
            **Branch:** `${{ github.ref_name }}`
          files: ${{ env.ZIP }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}